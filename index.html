const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mail = `<a href="mailto:${EMAIL}">${EMAIL}</a>`;
function show(code) {
  const t = T[code] || T.en;
  document.documentElement.lang = code;
  document.documentElement.dir = t.dir || 'ltr';
  document.title = t.title;
  document.getElementById('title').textContent = t.title;
  document.getElementById('text').innerHTML = t.s.map(([h, p]) =>
    (h ? `<h2>${esc(h)}</h2>` : '<div style="height:16px"></div>') + `<p>${esc(p).replace('{EMAIL}', mail)}</p>`
  ).join('') + `<p class="date">${esc(t.date)}</p>`;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === code));
  history.replaceState(null, '', '#' + code);
}
const nav = document.getElementById('langs');
for (const [code, t] of Object.entries(T)) {
  const b = document.createElement('button');
  b.dataset.l = code; b.textContent = t.name; b.onclick = () => show(code);
  nav.appendChild(b);
}
const want = location.hash.slice(1) || (navigator.language || 'en').slice(0, 2).toLowerCase();
show(T[want] ? want : 'en');
</script>
</body>
